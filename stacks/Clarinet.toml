[project]
name = "adam-protocol-stacks"
description = "Privacy-first stablecoin system on Stacks"
authors = ["Adam Protocol Team"]
telemetry = false
cache_dir = "./.cache"
requirements = []

# V3 Contracts - 6 decimal precision
[contracts.usdcx-v3]
path = "contracts/usdcx-v3.clar"
clarity_version = 2
epoch = 2.5

[contracts.adam-token-adusd-v3]
path = "contracts/adam-token-v3.clar"
clarity_version = 2
epoch = 2.5

[contracts.adam-token-adngn-v3]
path = "contracts/adam-token-v3.clar"
clarity_version = 2
epoch = 2.5

[contracts.adam-token-adkes-v3]
path = "contracts/adam-token-v3.clar"
clarity_version = 2
epoch = 2.5

[contracts.adam-token-adghs-v3]
path = "contracts/adam-token-v3.clar"
clarity_version = 2
epoch = 2.5

[contracts.adam-token-adzar-v3]
path = "contracts/adam-token-v3.clar"
clarity_version = 2
epoch = 2.5

[contracts.adam-swap-v3]
path = "contracts/adam-swap-v3.clar"
clarity_version = 2
epoch = 2.5
depends_on = ["adam-token-adusd-v3", "adam-token-adngn-v3", "adam-token-adkes-v3", "adam-token-adghs-v3", "adam-token-adzar-v3", "usdcx-v3"]

[repl.analysis]
passes = ["check_checker"]

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false
